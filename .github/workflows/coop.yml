# Builds and tests the co-op mod on every push to the development branch.
#
# The Windows job exists so nobody has to install a toolchain to play: it
# produces a single static .exe, downloadable from the run's Artifacts
# section. It also means both players can use the identical binary, which
# the co-op handshake requires.
name: Co-op build

on:
  push:
    branches: [ "claude/fervent-bohr-3njwft", "main" ]
    # Documentation-only pushes must not cancel a build someone is waiting
    # on: concurrency below cancels in-progress runs, and a quick docs commit
    # was enough to kill the artifact build it raced.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test netcode (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libjpeg-dev libopenmpt-dev \
            libpng-dev libsdl2-dev ccache

      # Most of a run is recompiling ~400 unchanged C++ files. Caching the
      # object files makes a launcher- or docs-only change rebuild in
      # seconds instead of minutes.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      # The launcher is PowerShell, so the compiler never sees it. A syntax
      # check alone is not enough either: an edit once deleted a function
      # while leaving its call site, which parses fine and only fails when a
      # user presses the button. This resolves every command it calls.
      - name: Check the launcher script
        shell: pwsh
        run: |
          ./tools/check-launcher.ps1
          # Runs the same function the Start button calls, for both the host
          # and join forms, so a broken command line fails here rather than
          # in someone's hands.
          ./tools/windows/PVZ-Coop-Launcher.ps1 -TestOnly

      - name: Build
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build
          ccache --show-stats | head -5

      # Needs no game assets, so the netcode is verified on every push.
      - name: Run co-op self-tests
        run: ./build/pvz-portable --coop-selftest

      # Two real processes over a real socket, which is what the players do.
      # Both must finish on the same simulation state.
      - name: Two-process lockstep test
        run: |
          ./build/pvz-portable --coop-nettest --host --port 35200 > host.log 2>&1 &
          sleep 2
          ./build/pvz-portable --coop-nettest --join 127.0.0.1:35200 > client.log 2>&1
          sleep 3
          echo "----- host -----";   cat host.log
          echo "----- client -----"; cat client.log

          grep -q "coop nettest: PASS" host.log   || { echo "host did not pass";   exit 1; }
          grep -q "coop nettest: PASS" client.log || { echo "client did not pass"; exit 1; }

          HOST_STATE=$(grep -o 'final state 0x[0-9A-F]*' host.log)
          CLIENT_STATE=$(grep -o 'final state 0x[0-9A-F]*' client.log)
          echo "host:   $HOST_STATE"
          echo "client: $CLIENT_STATE"
          if [ "$HOST_STATE" != "$CLIENT_STATE" ]; then
            echo "DESYNC: the two processes ended on different states"
            exit 1
          fi
          echo "Both processes agree on the final simulation state."

  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # cache: true keeps the downloaded packages between runs, which is
      # most of the setup time.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libopenmpt
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      # BUILD_STATIC so the result is one self-contained .exe with no DLLs
      # to copy around. CONSOLE=ON keeps a console window, which is how the
      # --coop-selftest and --coop-nettest output gets read.
      - name: Build
        shell: msys2 {0}
        run: |
          export CCACHE_DIR="$(cygpath -u '${{ github.workspace }}')/.ccache"
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCONSOLE=ON -DBUILD_STATIC=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build
          ccache --show-stats | head -5
          mkdir -p dist
          cp build/pvz-portable.exe dist/
          strip dist/pvz-portable.exe
          # Double-clickable launchers, so neither playing nor running the
          # tests needs a command line at all.
          cp tools/windows/*.bat dist/
          cp tools/windows/*.ps1 dist/

      - name: Verify the netcode in the Windows build
        shell: msys2 {0}
        run: ./dist/pvz-portable.exe --coop-selftest

      - uses: actions/upload-artifact@v7
        with:
          name: pvz-coop-windows
          path: dist/
